<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Budokai renderer</title>
<style>
@font-face { font-family: 'Zen Antique'; src: url(fonts/ZenAntique-Regular.ttf); }
@font-face { font-family: 'Yuji Boku'; src: url(fonts/YujiBoku-Regular.ttf); }
@font-face { font-family: 'Geist'; src: url(fonts/Geist.ttf); font-weight: 100 900; }
html, body { margin: 0; background: transparent; }
#stage { position: relative; overflow: hidden; }
canvas { display: block; }
.og-copy { position: absolute; left: 84px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.og-darb { font: 500 26px/1 'Geist', sans-serif; letter-spacing: 0.02em; }
.og-name { font: 400 128px/0.95 'Zen Antique', serif; letter-spacing: -0.01em; }
.og-line { font: 400 30px/1.35 'Geist', sans-serif; max-width: 16em; }
.og-jp { position: absolute; left: 30px; top: 64px; writing-mode: vertical-rl; font: 400 26px/1 'Yuji Boku', serif; letter-spacing: 0.3em; }
</style>
<script type="importmap">{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/",
  "opentype": "./node_modules/opentype.js/dist/opentype.module.js" } }</script>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<script type="module">
// ?variant=tile|og &w= &h= &scale=   (used by scripts/build.mjs; open by hand to preview)
import opentype from 'opentype'
import { createScene } from './src/scene.js'
const q = new URLSearchParams(location.search)
const tokens = await (await fetch('./src/tokens.json')).json()
const font = opentype.parse(await (await fetch('./fonts/' + tokens.type.seal.file)).arrayBuffer())
const w = +q.get('w') || 1024, h = +q.get('h') || 1024, variant = q.get('variant') || 'tile'
const stage = document.getElementById('stage'), canvas = document.getElementById('c')
stage.style.width = canvas.style.width = w + 'px'
stage.style.height = canvas.style.height = h + 'px'
const s = await createScene({ canvas, w, h, variant, scale: +q.get('scale') || 0.6, tokens, font })
const C = tokens.color
if (variant === 'og') {
  const k = w / 1200
  // lay the copy out on a 1200 px wide card, then scale the whole card, so every size keeps the same composition
  stage.insertAdjacentHTML('beforeend', `<div style="position:absolute;left:0;top:0;width:1200px;height:${h / k}px;transform:scale(${k});transform-origin:0 0">
    <div class="og-copy">
      <div class="og-darb" style="color:${C.muted.hex}">Darb</div>
      <div class="og-name" style="color:${C.ivory.hex}">${tokens.shortName}</div>
      <div class="og-line" style="color:${C.ivory.hex};opacity:.82">${tokens.tagline}</div></div>
    <div class="og-jp" style="color:${C.gold.hex}">${tokens.japanese}</div></div>`)
}
await document.fonts.ready
for (let i = 0; i < 3; i++) s.render()
window.__ready = true
</script>
</body>
</html>
