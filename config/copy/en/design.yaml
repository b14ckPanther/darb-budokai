# The /design style page (dev and demo only).
title: Design system
lede: Every token and component of the Seal Stone direction, rendered from config/design and the brand file.
sections:
  colour:
    title: Colour
    body: Brand colours by role. Gold means earned. Ki orange is light and energy, never text.
  type:
    title: Type
    body: Zen Antique for large headings, Geist for everything you read, Yuji Boku for the seal.
  shape:
    title: Space, radius, depth
    body: A four-point spacing scale, five radii and three shadows tinted with night.
  motion:
    title: Motion
    body: Springs, not durations. Each curve below is integrated from stiffness and damping.
  icons:
    title: Icons and sigils
    body: Solar Bold Duotone for controls. Original sigils for stats, evidence and rarity.
  components:
    title: Components
    body: Built for a thumb first. Every control is at least 44 points and works from the keyboard.
  map:
    title: Map look test
    body: One patch of procedural arena stone with engraved contours, ember light and fog at three light levels.
